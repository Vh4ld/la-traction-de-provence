name: Publication

# Publie l'image du site sur GHCR ; Watchtower la déploie ensuite sur le VPS.
on:
  push:
    branches: [main]
  # Chaque lundi à 4 h (UTC) : reconstruction pour intégrer les correctifs de l'image nginx.
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publication
  cancel-in-progress: false

jobs:
  checks:
    name: Vérifications
    uses: ./.github/workflows/ci.yml

  publish:
    name: Image sur GHCR
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/vh4ld/la-traction-de-provence
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          pull: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
