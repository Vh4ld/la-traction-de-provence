name: CI

on:
  push:
    branches: ['**']
  pull_request:
  # Réutilisé par le workflow de publication (release.yml).
  workflow_call:

permissions:
  contents: read

concurrency:
  # Le nom du workflow distingue la CI directe de la CI appelée par « Publication » (même branche).
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (compilation, liens, accessibilité)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Installer Chromium pour Playwright
        run: npx playwright install --with-deps chromium

      - run: npm test

      - name: Rapport Playwright
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  container:
    name: Image Docker (nginx, en-têtes, redirections)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Construire l'image
        run: docker build -t traction-site:ci .

      - name: Vérifier la configuration nginx
        run: docker run --rm traction-site:ci nginx -t

      - name: Démarrer le conteneur comme en production
        run: |
          docker run -d --name site --user 101:101 --read-only \
            --tmpfs /tmp:size=32m,mode=1777,noexec,nosuid,nodev \
            --cap-drop ALL --security-opt no-new-privileges \
            --memory 128m --cpus 0.5 --pids-limit 64 \
            -p 8080:8080 traction-site:ci
          for i in $(seq 1 30); do curl -fs -o /dev/null http://localhost:8080/ && break; sleep 1; done

      - name: Vérifier le contrôle de santé (depuis le conteneur)
        run: test "$(docker exec site wget -qO- http://127.0.0.1:8080/healthz)" = "ok"

      - name: Vérifier l'utilisateur et l'absence d'apk
        run: |
          test "$(docker exec site id -u)" = "101"
          ! docker exec site sh -c 'command -v apk'

      - name: Vérifier pages, en-têtes et redirections
        run: tests/container/check.sh http://localhost:8080

      - name: Journaux du conteneur
        if: always()
        run: docker logs site
