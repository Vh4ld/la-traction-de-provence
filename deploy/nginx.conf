# Configuration du site La Traction de Provence (nginx non privilégié, port 8080).
# TLS, HSTS et certificat : gérés en amont par Nginx Proxy Manager.

# ---------- Redirections des anciennes adresses SPIP ----------
# Numéro d'article : spip.php?page=article&id_article=53, spip.php?article53, …&lang=fr
map $args $legacy_article_id {
    default "";
    "~(?:^|&)id_article=(?<id>\d+)" $id;
    "~^article(?<id>\d+)" $id;
}
map $legacy_article_id $legacy_article_url {
    default "";
    include /etc/nginx/redirects/articles.map;
}

map $args $legacy_rubrique_id {
    default "";
    "~(?:^|&)id_rubrique=(?<id>\d+)" $id;
    "~^rubrique(?<id>\d+)" $id;
}
map $legacy_rubrique_id $legacy_rubrique_url {
    default "";
    include /etc/nginx/redirects/rubriques.map;
}

# PDF : /IMG/pdf/AC4606.pdf → /documents/ac4606.pdf
map $uri $legacy_pdf_url {
    default "";
    include /etc/nginx/redirects/pdfs.map;
}

# Durée de cache selon le type de fichier
map $uri $cache_control {
    default                      "no-cache";
    "~^/_astro/"                 "public, max-age=31536000, immutable";
    "~*\.(pdf|jpe?g|png|webp|avif|gif|svg|ico|woff2?)$" "public, max-age=2592000";
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    # Redirections relatives : correctes derrière le proxy (HTTPS, domaine public).
    absolute_redirect off;
    charset utf-8;

    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_types text/plain text/css text/xml application/javascript application/json application/xml image/svg+xml;

    include /etc/nginx/security-headers.conf;
    add_header Cache-Control $cache_control always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /spip.php {
        if ($legacy_article_url) {
            return 301 $legacy_article_url;
        }
        if ($legacy_rubrique_url) {
            return 301 $legacy_rubrique_url;
        }
        return 301 /;
    }

    location ^~ /IMG/pdf/ {
        if ($legacy_pdf_url) {
            return 301 $legacy_pdf_url;
        }
        return 404;
    }

    # Ancien site : tout autre chemin SPIP renvoie à l'accueil.
    location ~ ^/(ecrire|squelettes|plugins|prive|local|IMG)/ {
        return 301 /;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
