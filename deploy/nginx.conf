# Configuration du site La Traction de Provence (nginx non privilégié, port 8080).
# TLS, HSTS et certificat : gérés en amont par Nginx Proxy Manager.

# ---------- Redirections des anciennes adresses SPIP ----------
# Numéro d'article : spip.php?page=article&id_article=53, spip.php?article53, …&lang=fr
map $args $legacy_article_id {
    default "";
    "~(?:^|&)id_article=(?<id>\d+)" $id;
    "~^article(?<id>\d+)" $id;
}
map $legacy_article_id $legacy_article_url {
    default "";
    include /etc/nginx/redirects/articles.map;
}

map $args $legacy_rubrique_id {
    default "";
    "~(?:^|&)id_rubrique=(?<id>\d+)" $id;
    "~^rubrique(?<id>\d+)" $id;
}
map $legacy_rubrique_id $legacy_rubrique_url {
    default "";
    include /etc/nginx/redirects/rubriques.map;
}

# Ancienne page d'accueil SPIP (spip.php seul, ou ?page=sommaire) : seule adresse renvoyée vers l'accueil.
map $args $legacy_home {
    default 0;
    "" 1;
    "~(?:^|&)page=sommaire(?:&|$)" 1;
}

# PDF : /IMG/pdf/AC4606.pdf → /documents/ac4606.pdf
map $uri $legacy_pdf_url {
    default "";
    include /etc/nginx/redirects/pdfs.map;
}

# Durée de cache selon le type de fichier
map $uri $cache_control {
    default                      "no-cache";
    "~^/_astro/"                 "public, max-age=31536000, immutable";
    "~*\.(pdf|jpe?g|png|webp|avif|gif|svg|ico|woff2?)$" "public, max-age=2592000";
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    # Redirections relatives : correctes derrière le proxy (HTTPS, domaine public).
    absolute_redirect off;
    charset utf-8;

    # Site statique : seules les lectures sont acceptées, et aucun corps de requête n'est attendu.
    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }
    client_max_body_size 1k;

    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_types text/plain text/css text/xml application/javascript application/json application/xml image/svg+xml;

    include /etc/nginx/security-headers.conf;
    add_header Cache-Control $cache_control always;

    # Contrôle de santé : réservé au HEALTHCHECK Docker (depuis le conteneur), invisible de l'extérieur.
    location = /healthz {
        access_log off;
        if ($remote_addr != 127.0.0.1) {
            return 404;
        }
        default_type text/plain;
        return 200 "ok\n";
    }

    # Anciennes adresses SPIP : les pages reprises sont redirigées, le reste a disparu (410),
    # pour que les moteurs de recherche oublient les pages de spam de l'ancien site piraté.
    location = /spip.php {
        if ($legacy_article_url) {
            return 301 $legacy_article_url;
        }
        if ($legacy_rubrique_url) {
            return 301 $legacy_rubrique_url;
        }
        if ($legacy_home) {
            return 301 /;
        }
        return 410;
    }

    location ^~ /IMG/pdf/ {
        if ($legacy_pdf_url) {
            return 301 $legacy_pdf_url;
        }
        return 404;
    }

    # Fichiers cachés (.git, .env…) : jamais servis, sauf /.well-known/.
    location ~ /\.(?!well-known/) {
        return 404;
    }

    # Scripts côté serveur (anciens webshells PHP, etc.) : rien de tel n'existe ici.
    location ~* \.(?:php\d?|phtml|phar|asp|aspx|jsp|cgi)$ {
        return 410;
    }

    # Autres répertoires de l'ancien site SPIP : disparus.
    location ~ ^/(?:ecrire|squelettes|plugins|prive|local|IMG|config|tmp)(?:/|$) {
        return 410;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # Pages d'erreur : la page 404 du site, jamais la page nginx par défaut.
    # 403 (répertoire sans index) devient 404 : on ne révèle pas quels répertoires existent.
    error_page 403 404 =404 /404.html;
    error_page 405 410 500 502 503 504 /404.html;
    location = /404.html {
        internal;
    }
}
