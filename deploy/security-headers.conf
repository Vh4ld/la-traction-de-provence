# En-têtes de sécurité (inclus dans le bloc server).
#
# ATTENTION : nginx n'hérite des add_header du bloc server QUE si le bloc location n'en
# déclare aucun. Un seul add_header dans une location supprime tous ceux-ci pour elle.
# Pour varier un en-tête selon l'adresse, passer par un map (comme Cache-Control),
# ou ré-inclure ce fichier dans la location concernée.
#
# CSP : tout est interdit par défaut, puis seules les ressources du site lui-même sont permises.
add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; manifest-src 'self'; object-src 'none'; frame-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'; upgrade-insecure-requests" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=(), browsing-topics=()" always;
add_header X-Frame-Options "DENY" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-site" always;
