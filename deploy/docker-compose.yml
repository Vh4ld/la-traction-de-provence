# Site La Traction de Provence — à lancer sur le VPS :
#   docker compose -f deploy/docker-compose.yml up -d
# Nginx Proxy Manager renvoie la-traction-de-provence.fr vers http://traction_site:8080.
# Le service watchtower ci-dessous met à jour traction_site à chaque nouvelle image publiée sur GHCR
# (vérification toutes les 5 minutes). Si un Watchtower tourne déjà sur le VPS, supprimer ce service :
# l'étiquette de traction_site suffit.

services:
  traction_site:
    image: ghcr.io/vh4ld/la-traction-de-provence:latest
    container_name: traction_site
    restart: unless-stopped
    # Utilisateur nginx non privilégié de l'image (UID/GID 101).
    user: "101:101"
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777,noexec,nosuid,nodev
    # Limites de ressources : un afflux de requêtes ne peut pas affamer les autres conteneurs du VPS.
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 64
    # Rotation des journaux : 3 fichiers de 10 Mo au plus.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    labels:
      - com.centurylinklabs.watchtower.enable=true
    networks:
      - proxy-net
    # Aucun port publié sur l'hôte : seul Nginx Proxy Manager y accède, par le réseau proxy-net.

  # Met à jour automatiquement les conteneurs portant l'étiquette watchtower.enable=true (et eux seuls).
  watchtower:
    # Fork maintenu de containrrr/watchtower (dépôt d'origine archivé).
    image: ghcr.io/nickfedor/watchtower:latest
    container_name: watchtower
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      WATCHTOWER_LABEL_ENABLE: "true"       # ne touche ni à Nginx Proxy Manager ni aux autres conteneurs
      WATCHTOWER_POLL_INTERVAL: "300"       # vérifie GHCR toutes les 5 minutes
      WATCHTOWER_CLEANUP: "true"            # supprime les anciennes images après mise à jour
      WATCHTOWER_ROLLING_RESTART: "true"
    volumes:
      # Accès au démon Docker : nécessaire pour redémarrer les conteneurs (équivalent à root sur l'hôte).
      - /var/run/docker.sock:/var/run/docker.sock
    labels:
      - com.centurylinklabs.watchtower.enable=false   # ne se met pas à jour lui-même
    mem_limit: 64m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  proxy-net:
    external: true
