# Site La Traction de Provence — à lancer sur le VPS :
#   docker compose -f deploy/docker-compose.yml up -d
# Nginx Proxy Manager renvoie la-traction-de-provence.fr vers http://traction_site:8080.
# Watchtower met à jour le conteneur à chaque nouvelle image publiée sur GHCR.

services:
  traction_site:
    image: ghcr.io/vh4ld/la-traction-de-provence:latest
    container_name: traction_site
    restart: unless-stopped
    # Utilisateur nginx non privilégié de l'image (UID/GID 101).
    user: "101:101"
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777,noexec,nosuid,nodev
    # Limites de ressources : un afflux de requêtes ne peut pas affamer les autres conteneurs du VPS.
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 64
    # Rotation des journaux : 3 fichiers de 10 Mo au plus.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    labels:
      - com.centurylinklabs.watchtower.enable=true
    networks:
      - proxy-net
    # Aucun port publié sur l'hôte : seul Nginx Proxy Manager y accède, par le réseau proxy-net.

networks:
  proxy-net:
    external: true
